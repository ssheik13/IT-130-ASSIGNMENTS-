<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Working with Text</title>

    <script>
        function workWithText() 
        {
        alert("inner".replace("nn", "!!"));
        }
    </script>
</head>
<body>
    <header>
        <h1>Working with Text</h1>
        <img src="beefpad.jpg" alt="Beef Pad Thai" width="50%" height="50%">
    </header>

    <main>
        <p> Click the button to replace the first n in the word inner. </p>

        <button type="button" onclick="workWithText()">
            Working with Text
        </button>
    </main>

    <footer> 
        <p> Thanks for visiting my page! </p>
    </footer>

   <!--
   Semantic tags describe the purpose of different parts of a page. 
   They help assistive technologies understand the page structure.
   They make the code easier to read and maintain. 
   -->

</body>
</html>
